<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7cc4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soso &amp; Hip">
<meta name="description" content="Soso &amp; Hip Run — help two sisters sprint down the golf course, hopping golf balls, deer, and geese. How far can they get?">
<meta property="og:title" content="Soso &amp; Hip Run">
<meta property="og:description" content="Help sisters Soso &amp; Hip sprint down the golf course, hopping golf balls, startled deer, and geese. How far can they get?">
<meta property="og:image" content="https://sosohip.com/icon-512.png">
<meta property="og:url" content="https://sosohip.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Soso &amp; Hip Run</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(#101a30, #0b1020); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    /* fill the *visual* viewport so the iOS address bar never crops the game */
    height: 100dvh;
  }
  canvas { display: block; background: #87c8e0; touch-action: none; }
  #hint {
    position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.75); font-size: 13px; letter-spacing: .3px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="hint">SPACE / tap to jump &nbsp;•&nbsp; hold for a higher hop &nbsp;•&nbsp; P pause &nbsp;•&nbsp; M mute</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ---- Fixed logical resolution, scaled to fit (DPR-aware for crisp phones) ----
  const W = 480, H = 720;
  function fit() {
    const vv = window.visualViewport;
    const vw = (vv && vv.width) || window.innerWidth;
    const vh = (vv && vv.height) || window.innerHeight;
    const s = Math.min(vw / W, vh / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    // backing store at device pixels → sharp on Retina; CSS size at logical px
    canvas.width = Math.round(W * s * dpr);
    canvas.height = Math.round(H * s * dpr);
    canvas.style.width = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
    // draw in logical W×H coordinates regardless of screen density
    ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  fit();

  // Lock out browser gestures that would fight the game on touch devices.
  ['gesturestart','gesturechange','contextmenu','dblclick'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  // ---- Perspective helpers ----
  // z = 1 (far, at horizon) -> z = 0 (near, at player). We project along a
  // vanishing point so the path narrows toward the top.
  const HORIZON = H * 0.34;          // y of vanishing point
  const VPX = W / 2;                 // vanishing point x
  const PLAYER_Z = 0.06;             // z-slot the sisters occupy
  const PATH_NEAR_HALF = 150;        // half-width of path at the player
  const PATH_FAR_HALF = 8;           // half-width of path at horizon

  function projY(z) { return HORIZON + (H - HORIZON) * (1 - z); }
  function scaleAt(z) { return 1 - z; }               // 0 at horizon .. ~1 near
  function pathHalf(z) { return PATH_FAR_HALF + (PATH_NEAR_HALF - PATH_FAR_HALF) * (1 - z); }
  // lane: -1 .. 1 across the path. Returns screen x at depth z.
  function projX(lane, z) { return VPX + lane * pathHalf(z); }

  // ---- Game state ----
  let state, score, best, speed, dist, spawnTimer, scenTimer, shakeT;
  let bonus = 0, pickTimer = 0, landT = 0;
  let gameT = 0, nextMile = 500, pickCombo = 0, lastPickT = -10;
  let newBest = false;
  let shield = false, invulnT = 0, shieldTimer = 12;
  best = parseInt(localStorage.getItem('sosohip_best') || '0', 10);
  let muted = localStorage.getItem('sosohip_mute') === '1';

  // ---- Tiny synth SFX (no audio files; unlocks on first tap) ----
  let AC = null;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function beep(f0, f1, dur, type, vol, when) {
    if (muted) return;
    const a = ac(); if (!a) return;
    const t = a.currentTime + (when || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    jump()  { beep(300, 640, 0.16, 'sine', 0.10); },
    land()  { beep(150, 85, 0.07, 'triangle', 0.08); },
    pick()  { beep(880, 1318, 0.10, 'sine', 0.10); beep(1318, 1760, 0.12, 'sine', 0.08, 0.07); },
    crash() { beep(220, 55, 0.42, 'sawtooth', 0.14); beep(160, 40, 0.5, 'square', 0.06, 0.05); },
    start() { beep(440, 880, 0.18, 'sine', 0.08); },
    mile()  { beep(660, 990, 0.09, 'sine', 0.09); beep(880, 1320, 0.12, 'sine', 0.09, 0.09); },
    shieldUp()  { beep(520, 1040, 0.15, 'sine', 0.10); beep(780, 1560, 0.18, 'sine', 0.08, 0.10); },
    shieldPop() { beep(400, 120, 0.25, 'square', 0.12); beep(900, 300, 0.20, 'sawtooth', 0.05, 0.02); },
  };
  function toggleMute() {
    muted = !muted;
    localStorage.setItem('sosohip_mute', muted ? '1' : '0');
  }

  const player = {
    lane: 0, y: 0, vy: 0, onGround: true, run: 0
  };

  // The sisters' looks — Soso blonde & pink, Hip brunette & blue.
  const SOSO = { hair:'#f7d36e', shade:'#d9a94e', shirt:'#e85d9e', skirt:'#ffd0e8', tie:'#ffffff', acc:'#e85d9e' };
  const HIP  = { hair:'#6f4526', shade:'#523018', shirt:'#5b8cff', skirt:'#d6e4ff', tie:'#ffd84d', acc:'#5b8cff' };

  const GRAVITY = 2600;
  const JUMP_V = 900;
  const JUMP_HOLD = 620;   // extra upward accel while holding
  let holding = false, holdT = 0;

  const obstacles = [];
  const scenery = [];        // trees / greens / bunkers / carts passing on the sides
  const pickups = [];        // golden golf balls to collect
  const parts = [];          // dust / sparkle particles
  const popups = [];         // floating "+25" texts
  const clouds = [];
  for (let i = 0; i < 5; i++) clouds.push({ x: Math.random()*W, y: 20+Math.random()*(HORIZON-50), s: .4+Math.random()*.7 });

  // Static rolling-hill silhouettes on the horizon, far → near.
  const HILLS = [
    { base: HORIZON+1, amp: 18, len: 260, off: 3.0,  clr: '#a9cf9b' },
    { base: HORIZON+2, amp: 26, len: 150, off: 0.0,  clr: '#8fbf7e' },
    { base: HORIZON+4, amp: 40, len: 210, off: 1.4,  clr: '#79ad68' },
  ];
  const SCENERY = ['tree','tree','tree','bush','bush','flowers','flowers','cart','green','bunker','sgolfer','pond'];

  // Obstacle kinds. h = how tall (world units) → informs jump clearance.
  const KINDS = [
    { t:'ball',  w:26,  h:22,  clr:'#ffffff' },
    { t:'ball',  w:26,  h:22,  clr:'#ffffff' },
    { t:'deer',  w:70,  h:80,  clr:'#a9713e' },
    { t:'golfer',w:60,  h:120, clr:'#2f6f4e' },
    { t:'sprink',w:44,  h:30,  clr:'#8fd0ff' },
    { t:'goose', w:44,  h:52,  clr:'#f4f4f4' },
  ];

  function reset() {
    state = 'menu';
    score = 0; bonus = 0; dist = 0; speed = 0.42;
    spawnTimer = 0; scenTimer = 0; pickTimer = 0; shakeT = 0; landT = 0;
    gameT = 0; nextMile = 500; pickCombo = 0; lastPickT = -10;
    shield = false; invulnT = 0; shieldTimer = 12;
    obstacles.length = 0; scenery.length = 0; pickups.length = 0; parts.length = 0; popups.length = 0;
    player.lane = 0; player.y = 0; player.vy = 0; player.onGround = true; player.run = 0;
    for (let i = 0; i < 6; i++) spawnScenery(0.35 + i * 0.11);  // dress the menu backdrop
  }

  function startGame() {
    if (state === 'menu' || state === 'over') {
      state = 'play';
      score = 0; bonus = 0; dist = 0; speed = 0.42;
      spawnTimer = 0.6; scenTimer = 0.2; pickTimer = 2.2;
      gameT = 0; nextMile = 500; pickCombo = 0; lastPickT = -10;
      shield = false; invulnT = 0; shieldTimer = 12;
      obstacles.length = 0; pickups.length = 0; parts.length = 0; popups.length = 0;
      player.y = 0; player.vy = 0; player.onGround = true;
      sfx.start();
    }
  }

  // particle helpers — screen-space
  function puff(x, y, n, clr, spread, up) {
    for (let i = 0; i < n; i++) parts.push({
      x, y, vx: (Math.random()-.5) * (spread||80), vy: -(Math.random()) * (up||60),
      life: .35 + Math.random()*.3, max: .65, clr, r: 2 + Math.random()*3.2
    });
  }
  function popup(x, y, txt, clr, size, life) {
    popups.push({ x, y, txt, clr: clr||'#fff', size: size||22, life: life||0.9 });
  }
  function feetY() { return projY(PLAYER_Z); }

  function jump() {
    ac();  // unlock audio on first user gesture
    if (state === 'paused') { state = 'play'; return; }
    if (state === 'menu' || state === 'over') { startGame(); return; }
    if (player.onGround) {
      player.vy = JUMP_V; player.onGround = false;
      holding = true; holdT = 0.18;
      sfx.jump();
      puff(VPX - 23, feetY(), 5, 'rgba(200,190,170,0.8)', 60, 40);
      puff(VPX + 23, feetY(), 5, 'rgba(200,190,170,0.8)', 60, 40);
    }
  }

  function togglePause() {
    if (state === 'play') { state = 'paused'; holding = false; }
    else if (state === 'paused') state = 'play';
  }

  // ---- Input ----
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
    else if (e.code === 'KeyP') togglePause();
    else if (e.code === 'KeyM') toggleMute();
  });
  addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') holding = false; });

  // Mute button hit-box (logical canvas coords)
  const MUTE = { x: W-58, y: 12, w: 46, h: 36 };
  function ptXY(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = ptXY(e);
    if (p.x >= MUTE.x-6 && p.x <= MUTE.x+MUTE.w+6 && p.y >= MUTE.y-6 && p.y <= MUTE.y+MUTE.h+6) {
      ac(); toggleMute(); return;
    }
    jump();
  });
  canvas.addEventListener('pointerup', () => holding = false);
  canvas.addEventListener('pointercancel', () => holding = false);
  canvas.addEventListener('pointerleave', () => holding = false);

  // Auto-pause when the tab/app goes to the background mid-run.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'play') { state = 'paused'; holding = false; }
  });

  function spawn() {
    const k = KINDS[(Math.random() * KINDS.length) | 0];
    // pick a lane biased to center so a single jump lane matters less; single-lane game
    obstacles.push({ ...k, z: 1.0, lane: (Math.random()*1.2 - 0.6), passed:false });
  }

  // Scenery lives on the grass beside/beyond the path (|lane| > ~1.4) and never collides.
  function spawnScenery(z) {
    const t = SCENERY[(Math.random() * SCENERY.length) | 0];
    const side = Math.random() < 0.5 ? -1 : 1;
    const lane = side * (1.45 + Math.random() * 2.6);
    scenery.push({ scenery: true, t, z: z != null ? z : 1.0, lane, side, seed: Math.random() });
  }

  reset();

  // ---- Update ----
  let last = performance.now();
  function tick(now) {
    let dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (state === 'play') update(dt);
    else if (state !== 'paused') animateIdle(dt);
    render();
    requestAnimationFrame(tick);
  }

  function animateIdle(dt) {
    player.run += dt * 6;
    // slow drift of the course behind the menu / game-over screen
    const dz = 0.10 * dt;
    scenTimer -= dt;
    if (scenTimer <= 0) { spawnScenery(); scenTimer = 0.7 * (0.6 + Math.random()); }
    for (const o of scenery) o.z -= dz;
    for (let i = scenery.length - 1; i >= 0; i--) if (scenery[i].z < -0.15) scenery.splice(i,1);
  }

  function update(dt) {
    // difficulty ramp
    speed += dt * 0.012;
    const worldDz = speed * dt;      // how much z closes per frame
    dist += speed * dt * 60;
    score = Math.floor(dist) + bonus;
    gameT += dt;

    // milestone feedback so the speed ramp is *felt*
    if (score >= nextMile) {
      nextMile += 500;
      sfx.mile();
      popup(W/2, H*0.44, 'SPEED UP!', '#ffffff', 30, 1.3);
    }

    // player run cycle + jump physics
    player.run += dt * (8 + speed*6);
    if (!player.onGround) {
      player.vy -= GRAVITY * dt;
      if (holding && holdT > 0) { player.vy += JUMP_HOLD * dt; holdT -= dt; }
      player.y += player.vy * dt * 0.01;   // world-ish units
      if (player.y <= 0) {
        player.y = 0; player.vy = 0; player.onGround = true;
        landT = 0.11; sfx.land();
        puff(VPX - 23, feetY(), 4, 'rgba(200,190,170,0.7)', 70, 30);
        puff(VPX + 23, feetY(), 4, 'rgba(200,190,170,0.7)', 70, 30);
      }
    }
    if (landT > 0) landT -= dt;
    if (invulnT > 0) invulnT -= dt;

    // spawn — the 0.8s floor keeps back-to-back obstacles humanly jumpable
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawn();
      spawnTimer = Math.max(0.8, (1.25 - speed*0.6) * (0.7 + Math.random()*0.7));
    }

    // move obstacles toward viewer
    for (const o of obstacles) {
      o.z -= worldDz;
      // critters get startled as the girls bear down on them
      if (!o.scared && o.z < 0.34 && (o.t==='deer' || o.t==='goose' || o.t==='golfer')) {
        o.scared = true; o.scareT = 0;
      }
      if (o.scared) o.scareT += dt;
      // collision window: obstacle passing through the player's z-slot
      if (!o.passed && o.z <= PLAYER_Z) {
        o.passed = true;
        const jumpClear = o.h * 0.9;               // must clear this height
        const cleared = player.y * 100 > jumpClear; // player.y in world units
        const laneClose = Math.abs(o.lane - player.lane) < 0.55;
        if (laneClose && !cleared) {
          if (invulnT > 0) {
            // still flashing from a shield save — brush past unharmed
          } else if (shield) {
            shield = false; invulnT = 1.2;
            shakeT = 0.15;
            sfx.shieldPop();
            puff(VPX, feetY() - 40, 14, 'rgba(130,220,255,0.9)', 170, 110);
            popup(VPX, feetY() - 100, 'SAVED!', '#7fe3ff', 26);
          } else {
            crash();
          }
        } else if (laneClose && cleared) {
          // near-miss bonus: you jumped something that would have hit you
          bonus += 10;
          popup(projX(o.lane, PLAYER_Z), feetY() - 95, '+10', '#cfeeff', 18);
        }
      }
    }
    // cull
    for (let i = obstacles.length - 1; i >= 0; i--) if (obstacles[i].z < -0.1) obstacles.splice(i,1);

    // golden golf balls — spawn, approach, collect (streaks build a combo)
    pickTimer -= dt;
    if (pickTimer <= 0) {
      pickups.push({ pickup: true, kind: 'gold', z: 1.0, lane: Math.random()*1.1 - 0.55, taken: false });
      pickTimer = 1.4 * (0.6 + Math.random());
    }
    // shield bubbles — rare; one saved hit each
    shieldTimer -= dt;
    if (shieldTimer <= 0) {
      pickups.push({ pickup: true, kind: 'shield', z: 1.0, lane: Math.random()*1.1 - 0.55, taken: false });
      shieldTimer = 16 + Math.random() * 12;
    }
    for (const p of pickups) {
      p.z -= worldDz;
      if (!p.taken && p.z <= PLAYER_Z + 0.01 && Math.abs(p.lane - player.lane) < 0.5) {
        p.taken = true;
        const px = projX(p.lane, PLAYER_Z);
        if (p.kind === 'shield') {
          if (!shield) {
            shield = true;
            sfx.shieldUp();
            popup(px, feetY() - 70, 'SHIELD!', '#7fe3ff');
          } else {
            bonus += 50;   // already bubbled — cash it in instead
            sfx.pick();
            popup(px, feetY() - 70, '+50', '#7fe3ff');
          }
          puff(px, feetY() - 30, 12, 'rgba(130,220,255,0.9)', 130, 90);
        } else {
          pickCombo = (gameT - lastPickT < 2.5) ? Math.min(pickCombo + 1, 5) : 1;
          lastPickT = gameT;
          const gain = 25 * pickCombo;
          bonus += gain;
          sfx.pick();
          puff(px, feetY() - 30, 10, 'rgba(255,215,80,0.95)', 120, 90);
          popup(px, feetY() - 70, '+' + gain + (pickCombo > 1 ? '  ×' + pickCombo : ''), '#ffd84d');
        }
      }
    }
    for (let i = pickups.length - 1; i >= 0; i--) if (pickups[i].taken || pickups[i].z < -0.1) pickups.splice(i,1);

    // particles & popups
    for (const q of parts) { q.life -= dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 160*dt; }
    for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i,1);
    for (const q of popups) { q.life -= dt; q.y -= 46*dt; }
    for (let i = popups.length - 1; i >= 0; i--) if (popups[i].life <= 0) popups.splice(i,1);

    // scenery: spawn thickly, move with the world, cull behind the camera
    scenTimer -= dt;
    if (scenTimer <= 0) { spawnScenery(); scenTimer = 0.32 * (0.55 + Math.random()*0.9); }
    for (const o of scenery) o.z -= worldDz;
    for (let i = scenery.length - 1; i >= 0; i--) if (scenery[i].z < -0.15) scenery.splice(i,1);

    if (shakeT > 0) shakeT -= dt;
  }

  function crash() {
    state = 'over';
    shakeT = 0.4;
    sfx.crash();
    puff(VPX, feetY() - 20, 16, 'rgba(120,120,120,0.8)', 180, 120);
    if (score > best) { best = score; localStorage.setItem('sosohip_best', String(best)); newBest = true; }
    else newBest = false;
  }

  // ---- Render ----
  function render() {
    ctx.save();
    if (shakeT > 0) {
      const m = shakeT * 18;
      ctx.translate((Math.random()-.5)*m, (Math.random()-.5)*m);
    }

    drawWorld();
    // draw scenery + obstacles + pickups far -> near (painter's algorithm)
    const sorted = scenery.concat(obstacles, pickups).sort((a,b) => b.z - a.z);
    for (const o of sorted) (o.scenery ? drawScenery : o.pickup ? drawPickup : drawObstacle)(o);
    drawSisters();
    drawParticles();

    ctx.restore();
    drawHUD();
  }

  function drawWorld() {
    // sky — cool blue up top, warm and hazy at the horizon
    const sky = ctx.createLinearGradient(0,0,0,HORIZON);
    sky.addColorStop(0, '#7cc4ef'); sky.addColorStop(0.75, '#cdeafb'); sky.addColorStop(1, '#f0f6e0');
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,HORIZON+2);

    // sun with a soft glow
    const sunX = W*0.80, sunY = 74;
    const glow = ctx.createRadialGradient(sunX,sunY,6,sunX,sunY,64);
    glow.addColorStop(0,'rgba(255,244,200,0.95)');
    glow.addColorStop(0.35,'rgba(255,236,160,0.45)');
    glow.addColorStop(1,'rgba(255,236,160,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(sunX,sunY,64,0,7); ctx.fill();
    ctx.fillStyle = '#fff6cf'; ctx.beginPath(); ctx.arc(sunX,sunY,20,0,7); ctx.fill();

    // rolling hills on the horizon (far layer first)
    for (const h of HILLS) {
      ctx.fillStyle = h.clr;
      ctx.beginPath();
      ctx.moveTo(0, h.base);
      for (let x=0;x<=W;x+=12){
        const y = h.base - (Math.sin(x/h.len*6.283 + h.off) + 1) * 0.5 * h.amp - 4;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, h.base); ctx.closePath(); ctx.fill();
    }
    // atmospheric haze pooling at the base of the hills
    const haze = ctx.createLinearGradient(0,HORIZON-26,0,HORIZON+2);
    haze.addColorStop(0,'rgba(240,248,255,0)'); haze.addColorStop(1,'rgba(240,248,255,0.55)');
    ctx.fillStyle = haze; ctx.fillRect(0,HORIZON-26,W,28);

    // clouds
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (const c of clouds) {
      c.x -= 6 * 0.016 * (state==='play'?speed*4:1);
      if (c.x < -60) { c.x = W+40; c.y = 20+Math.random()*(HORIZON-70); }
      cloud(c.x, c.y, 26*c.s);
    }

    // ground base
    const grass = ctx.createLinearGradient(0,HORIZON,0,H);
    grass.addColorStop(0, '#4e9a46'); grass.addColorStop(1, '#3c8636');
    ctx.fillStyle = grass; ctx.fillRect(0,HORIZON,W,H-HORIZON);

    // mowed fairway stripes — perspective bands scrolling toward the viewer
    const N = 18, scroll = (dist*0.03) % 1;
    for (let i=-1;i<N;i++){
      const zN = (i - scroll)/N, zF = (i + 1 - scroll)/N;
      if (zF <= 0.001 || zN >= 1) continue;
      const yTop = projY(Math.min(zF,1)), yBot = projY(Math.max(zN,0.001));
      ctx.fillStyle = ((((i%2)+2)%2)) ? 'rgba(255,255,255,0.05)' : 'rgba(0,50,0,0.06)';
      ctx.fillRect(0, yTop, W, yBot - yTop + 1);
    }

    // distant tree line along the horizon
    ctx.fillStyle = '#2c6b3a';
    ctx.beginPath();
    ctx.moveTo(0,HORIZON+3);
    for (let x=0;x<=W;x+=18){
      ctx.lineTo(x, HORIZON - 2 - (Math.sin(x*0.21)+1)*5 - (Math.sin(x*0.07)+1)*3);
    }
    ctx.lineTo(W,HORIZON+3); ctx.closePath(); ctx.fill();

    // sandy shoulders flanking the cart path
    ctx.fillStyle = '#cdbd8d';
    ctx.beginPath();
    ctx.moveTo(projX(-1.12,0.001), projY(0.001));
    ctx.lineTo(projX( 1.12,0.001), projY(0.001));
    ctx.lineTo(projX( 1.12,0.999), projY(0.999));
    ctx.lineTo(projX(-1.12,0.999), projY(0.999));
    ctx.closePath(); ctx.fill();

    // cart path — concrete, hazier in the distance, no center line
    const pave = ctx.createLinearGradient(0,HORIZON,0,H);
    pave.addColorStop(0, '#6c6f78'); pave.addColorStop(1, '#4d4f55');
    ctx.fillStyle = pave;
    ctx.beginPath();
    ctx.moveTo(projX(-1,0.001), projY(0.001));
    ctx.lineTo(projX( 1,0.001), projY(0.001));
    ctx.lineTo(projX( 1,0.999), projY(0.999));
    ctx.lineTo(projX(-1,0.999), projY(0.999));
    ctx.closePath(); ctx.fill();
    // soft light edges
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(projX(-1,0.02), projY(0.02)); ctx.lineTo(projX(-1,0.999), projY(0.999));
    ctx.moveTo(projX( 1,0.02), projY(0.02)); ctx.lineTo(projX( 1,0.999), projY(0.999));
    ctx.stroke();
    // faint expansion joints across the path — a subtle speed cue, not a center line
    const seam = (dist*0.02) % 1;
    ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = 1;
    for (let i=0;i<7;i++){
      const z = (i + seam)/7;
      if (z<=0.03||z>=0.99) continue;
      const y = projY(z);
      ctx.beginPath(); ctx.moveTo(projX(-1,z), y); ctx.lineTo(projX(1,z), y); ctx.stroke();
    }
  }

  function cloud(x,y,r){
    ctx.beginPath();
    ctx.arc(x,y,r,0,7); ctx.arc(x+r,y+4,r*0.8,0,7); ctx.arc(x-r,y+5,r*0.7,0,7);
    ctx.arc(x+r*0.4,y-r*0.5,r*0.7,0,7); ctx.fill();
  }

  function drawPickup(p) {
    const s = scaleAt(p.z);
    if (s <= 0.02) return;
    const x = projX(p.lane, p.z);
    const gy = projY(p.z);
    const bob = Math.sin(dist*0.15 + p.lane*7) * 4 * s;
    ctx.save();
    if (p.kind === 'shield') {
      // floating shield bubble
      const r = 13 * s;
      const cy = gy - r - 5*s - bob;
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath(); ctx.ellipse(x, gy, r*0.9, r*0.32, 0, 0, 7); ctx.fill();
      ctx.shadowColor = 'rgba(120,220,255,0.9)'; ctx.shadowBlur = 12*s;
      ctx.fillStyle = 'rgba(140,225,255,0.35)';
      ctx.beginPath(); ctx.arc(x, cy, r, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#7fe3ff'; ctx.lineWidth = Math.max(1.5, 2.5*s);
      ctx.beginPath(); ctx.arc(x, cy, r, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = Math.max(1, 2*s);
      ctx.beginPath(); ctx.arc(x, cy, r*0.62, -2.2, -0.9); ctx.stroke();
      ctx.restore();
      return;
    }
    const r = 11 * s;
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(x, gy, r*0.9, r*0.32, 0, 0, 7); ctx.fill();
    // golden ball with glow + shine
    ctx.shadowColor = 'rgba(255,210,60,0.8)'; ctx.shadowBlur = 10*s;
    ctx.fillStyle = '#ffd84d';
    ctx.beginPath(); ctx.arc(x, gy - r - 4*s - bob, r, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(x - r*0.3, gy - r - 4*s - bob - r*0.3, r*0.3, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawParticles() {
    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.clr;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const q of popups) {
      ctx.globalAlpha = Math.min(1, q.life * 2);
      ctx.font = '800 ' + q.size + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(20,40,60,0.35)'; ctx.lineWidth = 3;
      ctx.strokeText(q.txt, q.x, q.y);
      ctx.fillStyle = q.clr;
      ctx.fillText(q.txt, q.x, q.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawObstacle(o) {
    const s = scaleAt(o.z);
    if (s <= 0.02) return;
    const x = projX(o.lane, o.z);
    const groundY = projY(o.z);
    const w = o.w * s, h = o.h * s;
    ctx.save();
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(x, groundY, w*0.6, w*0.22, 0, 0, 7); ctx.fill();
    // startled critters panic-hop in place as the girls bear down
    if (o.scared && (o.t === 'deer' || o.t === 'goose')) {
      ctx.translate(0, -Math.abs(Math.sin(o.scareT * 13)) * 15 * s);
    }

    if (o.t === 'ball') {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x, groundY - h*0.5, h*0.5, 0, 7); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.lineWidth=1; ctx.stroke();
    } else if (o.t === 'deer') {
      ctx.fillStyle = o.clr;
      rr(x-w*0.35, groundY-h*0.55, w*0.7, h*0.4, 6*s);      // body
      rr(x+w*0.15, groundY-h*0.95, w*0.28, h*0.5, 4*s);     // neck/head
      ctx.fillStyle='#8a5a30';
      ctx.fillRect(x-w*0.3, groundY-h*0.2, w*0.12, h*0.2);  // legs
      ctx.fillRect(x+w*0.18, groundY-h*0.2, w*0.12, h*0.2);
      ctx.fillStyle='#fff'; ctx.fillRect(x-w*0.32, groundY-h*0.22, w*0.5, 2*s); // tail flash
    } else if (o.t === 'golfer') {
      // seen from behind too — hat, shirt, shorts
      ctx.fillStyle = o.clr; rr(x-w*0.35, groundY-h*0.7, w*0.7, h*0.4, 5*s);  // shirt
      ctx.fillStyle = '#eae2c8'; rr(x-w*0.3, groundY-h*0.32, w*0.6, h*0.3, 4*s); // shorts/legs
      ctx.fillStyle = '#f0c9a0'; ctx.beginPath(); ctx.arc(x, groundY-h*0.78, w*0.22,0,7); ctx.fill(); // neck/head
      ctx.fillStyle = '#d94f4f'; rr(x-w*0.24, groundY-h*0.95, w*0.48, h*0.12, 3*s); // cap
      if (o.scared) { // arms thrown up, waving
        const wave = Math.sin(o.scareT * 16) * 0.25;
        ctx.strokeStyle = '#f0c9a0'; ctx.lineWidth = Math.max(2, 5*s); ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x - w*0.32, groundY - h*0.62);
        ctx.lineTo(x - w*(0.5 + wave), groundY - h*1.05);
        ctx.moveTo(x + w*0.32, groundY - h*0.62);
        ctx.lineTo(x + w*(0.5 - wave), groundY - h*1.05);
        ctx.stroke();
      }
    } else if (o.t === 'sprink') {
      ctx.fillStyle = '#7a8a55'; rr(x-w*0.15, groundY-h*0.4, w*0.3, h*0.4, 3*s);
      ctx.strokeStyle = o.clr; ctx.lineWidth = 2*s;
      for (let a=-1;a<=1;a++){ ctx.beginPath(); ctx.moveTo(x, groundY-h*0.4);
        ctx.quadraticCurveTo(x+a*w*0.5, groundY-h*1.1, x+a*w*0.9, groundY-h*0.5); ctx.stroke(); }
    } else if (o.t === 'goose') {
      ctx.fillStyle = o.clr; rr(x-w*0.3, groundY-h*0.55, w*0.6, h*0.4, 6*s); // body
      ctx.fillStyle = '#333'; rr(x+w*0.05, groundY-h*0.95, w*0.18, h*0.5, 3*s); // neck
      ctx.fillStyle = '#f2a900'; ctx.fillRect(x+w*0.18, groundY-h*0.8, w*0.14, h*0.06);
    }
    ctx.restore();
  }

  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }

  function drawScenery(o) {
    const s = scaleAt(o.z);
    if (s <= 0.02) return;
    const x = projX(o.lane, o.z);
    const gy = projY(o.z);
    ctx.save();

    if (o.t === 'tree') {
      const th = 155 * s * (0.7 + o.seed*0.6);
      const tw = 13 * s * (0.7 + o.seed*0.6);
      ctx.fillStyle='rgba(0,0,0,0.16)';
      ctx.beginPath(); ctx.ellipse(x, gy, th*0.30, th*0.08, 0,0,7); ctx.fill();
      ctx.fillStyle='#6b4a2b'; ctx.fillRect(x-tw/2, gy-th*0.55, tw, th*0.55);
      ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(x+tw*0.1, gy-th*0.55, tw*0.4, th*0.55);
      const cy = gy-th*0.72, cr = th*0.34;
      ctx.fillStyle='#2f7d3f';
      ctx.beginPath();
      ctx.arc(x, cy, cr,0,7); ctx.arc(x-cr*0.7, cy+cr*0.25, cr*0.72,0,7);
      ctx.arc(x+cr*0.7, cy+cr*0.25, cr*0.72,0,7); ctx.arc(x, cy-cr*0.55, cr*0.7,0,7);
      ctx.fill();
      ctx.fillStyle='rgba(0,40,0,0.16)';
      ctx.beginPath(); ctx.arc(x+cr*0.4, cy+cr*0.35, cr*0.55,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.arc(x-cr*0.3, cy-cr*0.35, cr*0.5,0,7); ctx.fill();

    } else if (o.t === 'bush') {
      const r = 26*s;
      ctx.fillStyle='rgba(0,0,0,0.14)'; ctx.beginPath(); ctx.ellipse(x,gy,r*1.1,r*0.3,0,0,7); ctx.fill();
      ctx.fillStyle='#37853f';
      ctx.beginPath();
      ctx.arc(x,gy-r*0.5,r,0,7); ctx.arc(x-r*0.8,gy-r*0.3,r*0.7,0,7); ctx.arc(x+r*0.8,gy-r*0.3,r*0.7,0,7);
      ctx.fill();

    } else if (o.t === 'flowers') {
      // a little wildflower patch on the rough
      const cols = ['#ff8fb3','#ffd84d','#ffffff','#ffa4e0','#c17ae8'];
      for (let i=0;i<6;i++){
        const a = Math.sin(o.seed*97 + i*13.7)*22*s;
        const b = Math.cos(o.seed*57 + i*9.1)*9*s;
        ctx.fillStyle = '#2f7d3f';
        ctx.fillRect(x+a-0.8*s, gy+b-4*s, 1.6*s, 4*s);
        ctx.fillStyle = cols[(i + ((o.seed*10)|0)) % cols.length];
        ctx.beginPath(); ctx.arc(x+a, gy+b-5*s, 3.2*s, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath(); ctx.arc(x+a, gy+b-5*s, 1.1*s, 0, 7); ctx.fill();
      }

    } else if (o.t === 'pond') {
      const pw = 150*s, ph = 46*s;
      ctx.fillStyle='#4e8e3f';
      ctx.beginPath(); ctx.ellipse(x, gy, pw*0.54, ph*0.56, 0, 0, 7); ctx.fill();
      ctx.fillStyle='#6fc3e8';
      ctx.beginPath(); ctx.ellipse(x, gy, pw*0.5, ph*0.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.ellipse(x - pw*0.12, gy - ph*0.10, pw*0.22, ph*0.14, -0.2, 0, 7); ctx.fill();

    } else if (o.t === 'green') {
      const gw = 120*s, gh = 44*s, fh = 92*s;
      ctx.fillStyle='#68c95a';
      ctx.beginPath(); ctx.ellipse(x, gy, gw*0.5, gh*0.5, 0,0,7); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse(x, gy, gw*0.5, gh*0.5, 0,0,7); ctx.stroke();
      ctx.fillStyle='#20321f'; ctx.beginPath(); ctx.ellipse(x, gy-gh*0.05, 4*s, 2*s, 0,0,7); ctx.fill();
      ctx.strokeStyle='#efefef'; ctx.lineWidth=Math.max(1,2*s);
      ctx.beginPath(); ctx.moveTo(x, gy-gh*0.05); ctx.lineTo(x, gy-gh*0.05-fh); ctx.stroke();
      ctx.fillStyle='#e2483d';
      ctx.beginPath();
      ctx.moveTo(x, gy-gh*0.05-fh); ctx.lineTo(x+22*s, gy-gh*0.05-fh+8*s); ctx.lineTo(x, gy-gh*0.05-fh+16*s);
      ctx.closePath(); ctx.fill();

    } else if (o.t === 'bunker') {
      const bw=112*s, bh=40*s;
      ctx.fillStyle='#e7d8a8';
      ctx.beginPath(); ctx.ellipse(x, gy, bw*0.5, bh*0.5, 0,0,7); ctx.fill();
      ctx.strokeStyle='rgba(150,130,80,0.5)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse(x, gy, bw*0.5, bh*0.5, 0,0,7); ctx.stroke();

    } else if (o.t === 'cart') {
      const cw=82*s, ch=56*s;
      ctx.fillStyle='rgba(0,0,0,0.16)'; ctx.beginPath(); ctx.ellipse(x,gy,cw*0.55,cw*0.16,0,0,7); ctx.fill();
      ctx.fillStyle='#222';
      ctx.beginPath(); ctx.arc(x-cw*0.28, gy-ch*0.08, ch*0.16,0,7); ctx.arc(x+cw*0.28, gy-ch*0.08, ch*0.16,0,7); ctx.fill();
      ctx.fillStyle='#f4f1e6'; rr(x-cw*0.4, gy-ch*0.62, cw*0.8, ch*0.48, 5*s);
      ctx.fillStyle='#d9d4c2'; rr(x-cw*0.42, gy-ch*1.15, cw*0.84, ch*0.12, 3*s);
      ctx.fillStyle='#cfc9b6';
      ctx.fillRect(x-cw*0.36, gy-ch*1.08, cw*0.06, ch*0.5); ctx.fillRect(x+cw*0.30, gy-ch*1.08, cw*0.06, ch*0.5);
      ctx.fillStyle='#3b7bd0'; rr(x-cw*0.16, gy-ch*0.95, cw*0.32, ch*0.35, 4*s);
      ctx.fillStyle='#f0c9a0'; ctx.beginPath(); ctx.arc(x, gy-ch*1.02, cw*0.13,0,7); ctx.fill();
      ctx.fillStyle='#d94f4f'; rr(x-cw*0.14, gy-ch*1.12, cw*0.28, ch*0.09, 2*s);

    } else if (o.t === 'sgolfer') {
      const hh=112*s, hw=46*s;
      ctx.fillStyle='rgba(0,0,0,0.16)'; ctx.beginPath(); ctx.ellipse(x,gy,hw*0.5,hw*0.16,0,0,7); ctx.fill();
      ctx.fillStyle='#2f8f5e'; rr(x-hw*0.32, gy-hh*0.62, hw*0.64, hh*0.4, 5*s);
      ctx.fillStyle='#eae2c8'; rr(x-hw*0.28, gy-hh*0.26, hw*0.56, hh*0.28, 3*s);
      ctx.fillStyle='#f0c9a0'; ctx.beginPath(); ctx.arc(x, gy-hh*0.72, hw*0.2,0,7); ctx.fill();
      ctx.fillStyle='#3b6cd0'; rr(x-hw*0.2, gy-hh*0.9, hw*0.4, hh*0.1, 2*s);
    }
    ctx.restore();
  }

  function drawSisters() {
    const z = PLAYER_Z;
    const s = scaleAt(z) * 1.0;
    const baseY = projY(z) - player.y * 100 * s;  // lift when jumping
    const gap = 46 * s;
    // squash & stretch: stretch rising, squash on landing
    let sy = 1, sx = 1;
    if (!player.onGround) {
      const st = Math.min(0.12, Math.abs(player.vy) / 8000);
      sy = 1 + st; sx = 1 - st * 0.6;
    } else if (landT > 0) {
      sy = 0.86; sx = 1.10;
    }
    const anchor = projY(z);   // scale about the ground line so feet stay planted
    ctx.save();
    ctx.translate(VPX, anchor); ctx.scale(sx, sy); ctx.translate(-VPX, -anchor);
    // post-save flicker while briefly invulnerable
    if (invulnT > 0) ctx.globalAlpha = Math.sin(performance.now()/50) > 0 ? 0.45 : 0.9;
    drawGirl(VPX - gap/2, baseY, s, SOSO);
    drawGirl(VPX + gap/2, baseY, s, HIP);
    ctx.globalAlpha = 1;
    // shield bubble wrapping both sisters
    if (shield) {
      const pul = Math.sin(performance.now()/150) * 1.5;
      const bx = VPX, by = baseY - 30*s;
      ctx.fillStyle = 'rgba(130,220,255,0.13)';
      ctx.beginPath(); ctx.ellipse(bx, by, (64+pul)*s, (54+pul)*s, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(150,230,255,0.85)'; ctx.lineWidth = 2.5*s;
      ctx.beginPath(); ctx.ellipse(bx, by, (64+pul)*s, (54+pul)*s, 0, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2*s;
      ctx.beginPath(); ctx.ellipse(bx, by, 48*s, 40*s, 0, -2.3, -1.3); ctx.stroke();
    }
    ctx.restore();
  }

  // A sister seen from BEHIND: hair with bouncy ponytail, tee shirt, skirt,
  // swinging arms and legs, sneakers with her accent stripe.
  function drawGirl(cx, groundY, s, c) {
    const swing = Math.sin(player.run);
    const step = swing * 6 * s;
    const bodyW = 34 * s, bodyH = 46 * s, headR = 15 * s;

    // shadow (fades while airborne)
    const air = Math.min(1, player.y * 3);
    ctx.fillStyle = `rgba(0,0,0,${0.22*(1-air*0.7)})`;
    ctx.beginPath(); ctx.ellipse(cx, projY(PLAYER_Z), bodyW*0.55, bodyW*0.2, 0, 0, 7); ctx.fill();

    // arms swinging at the sides (drawn first, so shoulders tuck behind the shirt)
    ctx.strokeStyle = '#f2c9a0'; ctx.lineWidth = 6*s; ctx.lineCap = 'round';
    const shY = groundY - bodyH*0.52;
    ctx.beginPath();
    ctx.moveTo(cx - bodyW*0.46, shY);
    ctx.lineTo(cx - bodyW*0.58, shY + bodyH*0.30 - swing*6*s);
    ctx.moveTo(cx + bodyW*0.46, shY);
    ctx.lineTo(cx + bodyW*0.58, shY + bodyH*0.30 + swing*6*s);
    ctx.stroke();

    // legs, alternating, with socks and sneakers
    ctx.fillStyle = '#f2c9a0';
    ctx.fillRect(cx - bodyW*0.28, groundY - bodyH*0.18, bodyW*0.20, bodyH*0.36 + step);
    ctx.fillRect(cx + bodyW*0.08, groundY - bodyH*0.18, bodyW*0.20, bodyH*0.36 - step);
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - bodyW*0.30, groundY + bodyH*0.10 + step, bodyW*0.24, 6*s);
    ctx.fillRect(cx + bodyW*0.06, groundY + bodyH*0.10 - step, bodyW*0.24, 6*s);
    ctx.fillRect(cx - bodyW*0.32, groundY + bodyH*0.18 + step, bodyW*0.28, 5.5*s);
    ctx.fillRect(cx + bodyW*0.04, groundY + bodyH*0.18 - step, bodyW*0.28, 5.5*s);
    ctx.fillStyle = c.acc;
    ctx.fillRect(cx - bodyW*0.32, groundY + bodyH*0.18 + step + 3.5*s, bodyW*0.28, 2*s);
    ctx.fillRect(cx + bodyW*0.04, groundY + bodyH*0.18 - step + 3.5*s, bodyW*0.28, 2*s);

    // skirt, swaying with the run
    const sway = swing * 2.5 * s;
    ctx.fillStyle = c.skirt;
    ctx.beginPath();
    ctx.moveTo(cx - bodyW*0.50, groundY - bodyH*0.30);
    ctx.lineTo(cx + bodyW*0.50, groundY - bodyH*0.30);
    ctx.lineTo(cx + bodyW*0.66 + sway, groundY - bodyH*0.02);
    ctx.lineTo(cx - bodyW*0.66 + sway, groundY - bodyH*0.02);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.10)'; ctx.lineWidth = 1.5*s;
    ctx.beginPath();
    ctx.moveTo(cx - bodyW*0.66 + sway, groundY - bodyH*0.02);
    ctx.lineTo(cx + bodyW*0.66 + sway, groundY - bodyH*0.02);
    ctx.stroke();

    // torso (shirt) + sleeve caps
    ctx.fillStyle = c.shirt;
    rr(cx - bodyW/2, groundY - bodyH*0.68, bodyW, bodyH*0.42, 8*s);
    ctx.beginPath();
    ctx.arc(cx - bodyW*0.46, shY, 5.5*s, 0, 7);
    ctx.arc(cx + bodyW*0.46, shY, 5.5*s, 0, 7);
    ctx.fill();

    // neck — sliver of skin between shirt and hair
    ctx.fillStyle = '#f2c9a0';
    ctx.fillRect(cx - 4.5*s, groundY - bodyH*0.78, 9*s, 11*s);

    // head — seen from behind, so it's ALL hair (shaded layer underneath)
    const headY = groundY - bodyH*0.68 - headR*0.7;
    ctx.fillStyle = c.shade;
    ctx.beginPath(); ctx.arc(cx, headY + 1.5*s, headR*1.02, 0, 7); ctx.fill();
    ctx.fillStyle = c.hair;
    ctx.beginPath(); ctx.arc(cx, headY, headR, 0, 7); ctx.fill();
    // side tufts for a bit of volume
    ctx.beginPath();
    ctx.arc(cx - headR*0.85, headY + headR*0.45, headR*0.32, 0, 7);
    ctx.arc(cx + headR*0.85, headY + headR*0.45, headR*0.32, 0, 7);
    ctx.fill();
    // soft shine
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.arc(cx - headR*0.33, headY - headR*0.35, headR*0.34, 0, 7); ctx.fill();

    // PONYTAIL — the signature. Two layers, swinging and bouncing with the step.
    const topX = cx, topY = headY - headR*0.75;
    const bounce = Math.abs(swing);
    const tipX = cx + swing * 11 * s;
    const tipY = topY + 28*s + bounce*4*s;
    ctx.lineCap = 'round';
    ctx.strokeStyle = c.shade; ctx.lineWidth = 8.5*s;
    ctx.beginPath();
    ctx.moveTo(topX, topY);
    ctx.quadraticCurveTo(topX + swing*9*s, topY + 15*s, tipX, tipY + 1.5*s);
    ctx.stroke();
    ctx.strokeStyle = c.hair; ctx.lineWidth = 6.5*s;
    ctx.beginPath();
    ctx.moveTo(topX, topY);
    ctx.quadraticCurveTo(topX + swing*9*s, topY + 14*s, tipX, tipY);
    ctx.stroke();
    // hair tie
    ctx.fillStyle = c.tie;
    ctx.beginPath(); ctx.arc(topX, topY + 2*s, 3.4*s, 0, 7); ctx.fill();
  }

  function drawHUD() {
    // score chip
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    rr(12, 12, 118, 52, 12);
    ctx.fillStyle = '#1d3346';
    ctx.font = '800 24px -apple-system, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(String(score).padStart(5,'0'), 24, 38);
    ctx.font = '700 11px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(29,51,70,0.65)';
    ctx.fillText('BEST ' + String(best).padStart(5,'0'), 24, 55);

    // active-shield indicator beside the score chip
    if (shield && (state === 'play' || state === 'paused')) {
      ctx.fillStyle = 'rgba(140,225,255,0.35)';
      ctx.beginPath(); ctx.arc(152, 38, 12, 0, 7); ctx.fill();
      ctx.strokeStyle = '#59c8f0'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(152, 38, 12, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(152, 38, 7.5, -2.2, -0.9); ctx.stroke();
    }

    drawMuteBtn();

    if (state === 'paused') {
      ctx.fillStyle = 'rgba(10,25,45,0.45)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = '800 34px -apple-system, sans-serif';
      ctx.fillText('PAUSED', W/2, H*0.42);
      ctx.font = '600 16px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.fillText('SPACE / tap to resume', W/2, H*0.42 + 34);
      return;
    }

    if (state === 'menu' || state === 'over') {
      ctx.fillStyle = 'rgba(10,25,45,0.32)'; ctx.fillRect(0,0,W,H);

      // card
      const cardY = state === 'over' ? H*0.22 : H*0.26;
      const cardH = state === 'over' ? 232 : 178;
      ctx.save();
      ctx.shadowColor = 'rgba(15,35,60,0.35)'; ctx.shadowBlur = 28; ctx.shadowOffsetY = 8;
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      rr(W*0.09, cardY, W*0.82, cardH, 22);
      ctx.restore();

      // title: "Soso" pink, "&" dark, "Hip" blue
      ctx.font = '800 42px -apple-system, sans-serif';
      const t1 = 'Soso', t2 = ' & ', t3 = 'Hip';
      const w1 = ctx.measureText(t1).width, w2 = ctx.measureText(t2).width, w3 = ctx.measureText(t3).width;
      let tx = W/2 - (w1+w2+w3)/2;
      const titleY = cardY + 58;
      ctx.textAlign = 'left';
      ctx.fillStyle = SOSO.shirt; ctx.fillText(t1, tx, titleY); tx += w1;
      ctx.fillStyle = '#2b3a4a';  ctx.fillText(t2, tx, titleY); tx += w2;
      ctx.fillStyle = HIP.shirt;  ctx.fillText(t3, tx, titleY);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#2b3a4a';
      ctx.font = '800 22px -apple-system, sans-serif';
      ctx.fillText('R U N', W/2, titleY + 30);

      if (state === 'menu') {
        // how-to legend: gold = collect, white = jump, bubble = free bump
        ctx.font = '600 15px -apple-system, sans-serif';
        ctx.textAlign = 'left';
        const ly = titleY + 66, ly2 = ly + 28;
        ctx.save();
        ctx.shadowColor = 'rgba(255,210,60,0.8)'; ctx.shadowBlur = 8;
        ctx.fillStyle = '#ffd84d';
        ctx.beginPath(); ctx.arc(W/2 - 102, ly - 5, 8, 0, 7); ctx.fill();
        ctx.restore();
        ctx.fillStyle = '#d99a00';
        ctx.fillText('collect', W/2 - 88, ly);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(W/2 + 22, ly - 5, 8, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(W/2 + 22, ly - 5, 8, 0, 7); ctx.stroke();
        ctx.fillStyle = '#2b3a4a';
        ctx.fillText('jump!', W/2 + 36, ly);
        ctx.fillStyle = 'rgba(140,225,255,0.4)';
        ctx.beginPath(); ctx.arc(W/2 - 102, ly2 - 5, 8, 0, 7); ctx.fill();
        ctx.strokeStyle = '#59c8f0'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(W/2 - 102, ly2 - 5, 8, 0, 7); ctx.stroke();
        ctx.fillStyle = '#2380a8';
        ctx.fillText('one free bump!', W/2 - 88, ly2);
        ctx.textAlign = 'center';
      }

      if (state === 'over') {
        ctx.fillStyle = '#1d3346';
        ctx.font = '700 18px -apple-system, sans-serif';
        ctx.fillText('Wiped out!', W/2, titleY + 66);
        ctx.font = '800 34px -apple-system, sans-serif';
        ctx.fillText(String(score), W/2, titleY + 102);
        ctx.font = '700 13px -apple-system, sans-serif';
        ctx.fillStyle = 'rgba(29,51,70,0.6)';
        ctx.fillText('BEST ' + best, W/2, titleY + 124);
        if (newBest && score > 0) {
          ctx.fillStyle = '#e8a800';
          ctx.font = '800 22px -apple-system, sans-serif';
          const pulse = 1 + Math.sin(performance.now()/180) * 0.06;
          ctx.save(); ctx.translate(W/2, titleY + 152); ctx.scale(pulse, pulse);
          ctx.fillText('★ NEW BEST! ★', 0, 0); ctx.restore();
        }
      }

      // prompt below the card, gently pulsing
      const pa = 0.75 + Math.sin(performance.now()/300) * 0.2;
      ctx.font = '600 17px -apple-system, sans-serif';
      ctx.fillStyle = `rgba(255,255,255,${pa})`;
      ctx.fillText(state==='over' ? 'SPACE / tap to run again' : 'SPACE / tap to start',
                   W/2, cardY + cardH + 44);
    }
  }

  function drawMuteBtn() {
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    rr(MUTE.x, MUTE.y, MUTE.w, MUTE.h, 10);
    const sx = MUTE.x + 15, sy = MUTE.y + MUTE.h/2;
    ctx.fillStyle = '#1d3346';
    ctx.fillRect(sx - 3, sy - 4.5, 6, 9);
    ctx.beginPath();
    ctx.moveTo(sx + 3, sy - 4.5); ctx.lineTo(sx + 9, sy - 10);
    ctx.lineTo(sx + 9, sy + 10);  ctx.lineTo(sx + 3, sy + 4.5);
    ctx.closePath(); ctx.fill();
    if (!muted) {
      ctx.strokeStyle = '#1d3346'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(sx + 11, sy, 6, -0.7, 0.7); ctx.stroke();
      ctx.beginPath(); ctx.arc(sx + 11, sy, 10, -0.6, 0.6); ctx.stroke();
    } else {
      ctx.strokeStyle = '#d94f4f'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(MUTE.x + 30, sy - 9); ctx.lineTo(MUTE.x + 40, sy + 9);
      ctx.stroke();
    }
  }

  // Offline support: cache the shell so the home-screen install works anywhere.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
